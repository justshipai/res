<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Reverse Engineer Strategy: four choices, then testable forecasts</title><desc id="desc">Customer, Bet, Edge and Trade-off, judged using public evidence. Forecast likely next moves and test the theses on later runs.</desc><rect width="1600" height="1000" fill="white"/><text x="80" y="72" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#234CFF">RES</text><text x="190" y="69" font-family="Nimbus Mono PS, Courier New, monospace" font-size="19" font-weight="400" fill="#111111">REVERSE ENGINEER STRATEGY</text><text x="80" y="162" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="74" font-weight="700" fill="#111111">Four choices. One strategy?</text><text x="80" y="207" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#666666">Reconstruct your competitors’ choices from public evidence.</text><line x1="80" y1="242" x2="1520" y2="242" stroke="#D2D2D2"/><text x="80" y="300" font-family="Nimbus Mono PS, Courier New, monospace" font-size="22" font-weight="400" fill="#234CFF">01</text><text x="155" y="300" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#111111">Customer</text><text x="490" y="300" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="400" fill="#111111">Who are they choosing to win with?</text><text x="490" y="343" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#666666">Warning sign: an audience too broad to guide decisions.</text><line x1="80" y1="370" x2="1520" y2="370" stroke="#D2D2D2"/><text x="80" y="430" font-family="Nimbus Mono PS, Courier New, monospace" font-size="22" font-weight="400" fill="#234CFF">02</text><text x="155" y="430" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#111111">Bet</text><text x="490" y="430" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="400" fill="#111111">What will make customers choose them?</text><text x="490" y="473" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#666666">Warning sign: a feature list without a reason it wins.</text><line x1="80" y1="500" x2="1520" y2="500" stroke="#D2D2D2"/><text x="80" y="560" font-family="Nimbus Mono PS, Courier New, monospace" font-size="22" font-weight="400" fill="#234CFF">03</text><text x="155" y="560" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#111111">Edge</text><text x="490" y="560" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="400" fill="#111111">Why are they better placed to deliver?</text><text x="490" y="603" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#666666">Warning sign: an advantage equally available to competitors.</text><line x1="80" y1="630" x2="1520" y2="630" stroke="#D2D2D2"/><text x="80" y="690" font-family="Nimbus Mono PS, Courier New, monospace" font-size="22" font-weight="400" fill="#234CFF">04</text><text x="155" y="690" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#111111">Trade-off</text><text x="490" y="690" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="35" font-weight="400" fill="#111111">What will they do less of, or decline?</text><text x="490" y="733" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#666666">Warning sign: every opportunity becomes a priority.</text><line x1="80" y1="760" x2="1520" y2="760" stroke="#D2D2D2"/><text x="80" y="864" font-family="Nimbus Mono PS, Courier New, monospace" font-size="20" font-weight="400" fill="#234CFF">NEXT</text><text x="190" y="865" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#111111">Infer next moves. Then test them.</text><text x="190" y="910" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#666666">Evidence · Alternatives · Signals · Confidence · Reassessment dates</text><text x="80" y="968" font-family="Nimbus Mono PS, Courier New, monospace" font-size="20" font-weight="400" fill="#111111">github.com/justshipai/res</text><text x="1391" y="968" font-family="Nimbus Sans, Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111111">JustShipAI</text></svg>