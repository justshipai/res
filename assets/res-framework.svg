<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">RES: four tests of competitor strategy</title><desc id="desc">Customer, Bet, Edge and Trade-off, tested against evidence, alternatives and confidence.</desc><rect width="1600" height="1000" fill="#F5F2EA"/><text x="80" y="68" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#25745B">RES  /  REVERSE ENGINEER STRATEGY</text><text x="80" y="151" font-family="DejaVu Sans, sans-serif" font-size="66" font-weight="700" fill="#172C28">Read the choices.</text><text x="80" y="205" font-family="DejaVu Sans, sans-serif" font-size="29" font-weight="400" fill="#5D6D65">Understand your competitors through what they actually do.</text><rect x="80" y="250" width="708" height="246" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="110" y="293" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#25745B">01</text><text x="162" y="294" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#172C28">Customer</text><text x="110" y="354" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">Who are they choosing</text><text x="110" y="393" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">to win with?</text><line x1="110" y1="423" x2="758" y2="423" stroke="#D6DBD1"/><text x="110" y="464" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#5D6D65">Watch for: everyone is the audience.</text><rect x="812" y="250" width="708" height="246" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="842" y="293" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#25745B">02</text><text x="894" y="294" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#172C28">Bet</text><text x="842" y="354" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">What will make customers</text><text x="842" y="393" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">choose them?</text><line x1="842" y1="423" x2="1490" y2="423" stroke="#D6DBD1"/><text x="842" y="464" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#5D6D65">Watch for: a roadmap without a reason.</text><rect x="80" y="520" width="708" height="246" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="110" y="563" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#25745B">03</text><text x="162" y="564" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#172C28">Edge</text><text x="110" y="624" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">Why are they better placed</text><text x="110" y="663" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">to deliver?</text><line x1="110" y1="693" x2="758" y2="693" stroke="#D6DBD1"/><text x="110" y="734" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#5D6D65">Watch for: an advantage anyone can copy.</text><rect x="812" y="520" width="708" height="246" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="842" y="563" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#25745B">04</text><text x="894" y="564" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="700" fill="#172C28">Trade-off</text><text x="842" y="624" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">What will they do less of,</text><text x="842" y="663" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="400" fill="#172C28">or decline?</text><line x1="842" y1="693" x2="1490" y2="693" stroke="#D6DBD1"/><text x="842" y="734" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#5D6D65">Watch for: everything is a priority.</text><rect x="80" y="804" width="1440" height="120" rx="18" fill="#172C28" stroke="none"/><text x="110" y="851" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">The verdict: do these choices reinforce one another?</text><text x="110" y="892" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#C9D9CC">Dated evidence  ·  Alternative explanations  ·  Explicit confidence</text><text x="80" y="969" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" fill="#5D6D65">github.com/justshipai/res</text><text x="1240" y="969" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#25745B">JustShipAI</text></svg>