<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Notion strategy assessed with RES</title><desc id="desc">A sourced interpretation of Notion’s Customer, Bet, Edge and Trade-off. The weakest link is whether its context remains distinctive.</desc><rect width="1600" height="1000" fill="#F5F2EA"/><text x="80" y="68" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" fill="#25745B">RES  /  INDEPENDENT ASSESSMENT  /  28 OCT 2026</text><text x="80" y="150" font-family="DejaVu Sans, sans-serif" font-size="60" font-weight="700" fill="#172C28">Notion’s strategy, decoded.</text><text x="80" y="207" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="400" fill="#5D6D65">A coherent platform bet. An unproven edge.</text><rect x="80" y="260" width="708" height="194" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="110" y="308" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#25745B">Customer</text><text x="110" y="367" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">Teams coordinating work,</text><text x="110" y="404" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">with admins governing agents.</text><rect x="812" y="260" width="708" height="194" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="842" y="308" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#25745B">Bet</text><text x="842" y="367" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">Turn shared team context</text><text x="842" y="404" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">into repeatable action.</text><rect x="80" y="480" width="708" height="194" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="110" y="528" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#25745B">Edge</text><text x="110" y="587" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">Knowledge, databases and permissions.</text><text x="110" y="624" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">Useful context, but is it distinctive?</text><rect x="812" y="480" width="708" height="194" rx="18" fill="#FFFFFF" stroke="#D6DBD1"/><text x="842" y="528" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#25745B">Trade-off</text><text x="842" y="587" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">Let outside agents do the work.</text><text x="842" y="624" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="400" fill="#172C28">Keep the workspace relevant.</text><rect x="80" y="716" width="1440" height="148" rx="18" fill="#F3D18C" stroke="none"/><text x="110" y="764" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700" fill="#172C28">Weakest link: Edge</text><text x="110" y="811" font-family="DejaVu Sans, sans-serif" font-size="27" font-weight="400" fill="#172C28">If agents can reach every system directly, what keeps Notion central?</text><text x="80" y="916" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#5D6D65">RES interpretation, not Notion’s endorsement. Research: 28 Apr–28 Oct 2026.</text><text x="80" y="961" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#5D6D65">Sources and full reasoning: github.com/justshipai/res</text><text x="1325" y="961" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="700" fill="#25745B">JustShipAI</text></svg>